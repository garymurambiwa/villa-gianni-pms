services:
  - type: web
    name: villa-gianni-pms
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: villa-gianni-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.11.0
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"

databases:
  - name: villa-gianni-db
    databaseName: villa_gianni
    user: villa_gianni_user
    plan: free
