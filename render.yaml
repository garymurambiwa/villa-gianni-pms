services:
  - type: web
    name: villa-gianni-pms
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard to your Neon URL
      - key: VITE_DATABASE_URL
        sync: false # Set this in Render Dashboard to your Neon URL
      - key: NODE_VERSION
        value: 20.11.0
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
