name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Deploying Baradzanwa ==="
            cd /var/www/baradzanwa
            git pull origin main
            npm install --omit=dev
            npm run build

            echo "=== Deploying Villa Gianni ==="
            cd /var/www/villa-gianni
            git pull origin main
            npm install --omit=dev
            npm run build

            echo "=== Restarting apps ==="
            pm2 restart all

            echo "=== Done ==="
            pm2 status
